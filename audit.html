<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>VHP | Federal Audit Log</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200..800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#00101d] text-white font-sans overflow-hidden h-screen flex">
    <main class="flex-1 flex flex-col overflow-hidden">
        <header class="h-20 border-b border-[#162a45] flex items-center justify-between px-8 bg-[#001830]">
            <h2 class="text-xl font-bold">Federal Compliance Audit</h2>
            <div class="px-3 py-1 border border-[#008080]/40 rounded-full bg-[#008080]/5">
                <span class="text-[9px] text-[#2dd4bf] font-bold italic uppercase tracking-tighter">READ-ONLY ARCHIVE</span>
            </div>
        </header>

        <div class="p-8">
            <div class="bg-[#001830] border border-[#162a45] rounded-xl overflow-hidden shadow-2xl">
                <table class="w-full text-left">
                    <thead class="bg-black/40 text-[10px] font-bold text-slate-400 uppercase tracking-widest border-b border-[#162a45]">
                        <tr>
                            <th class="px-6 py-4">Timestamp</th>
                            <th class="px-6 py-4">Action</th>
                            <th class="px-6 py-4">Entity</th>
                            <th class="px-6 py-4">Status</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-[#162a45] text-xs">
                        <tr class="hover:bg-white/5 transition-colors">
                            <td class="px-6 py-4 font-mono text-slate-400">2025-12-18 09:12</td>
                            <td class="px-6 py-4 font-bold text-white">Eligibility Review Initiated</td>
                            <td class="px-6 py-4">Sgt. James Miller</td>
                            <td class="px-6 py-4"><span class="bg-yellow-500/10 text-yellow-500 px-2 py-0.5 rounded border border-yellow-500/20 font-bold uppercase text-[9px]">Pending</span></td>
                        </tr>
                        <tr class="hover:bg-white/5 transition-colors">
                            <td class="px-6 py-4 font-mono text-slate-400">2025-12-17 14:45</td>
                            <td class="px-6 py-4 font-bold text-white">Document Verification</td>
                            <td class="px-6 py-4">Cpl. Sarah Jenkins</td>
                            <td class="px-6 py-4"><span class="bg-[#2dd4bf]/10 text-[#2dd4bf] px-2 py-0.5 rounded border border-[#2dd4bf]/20 font-bold uppercase text-[9px]">Verified</span></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</body>
</html>
