<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>VHP Geospatial Map</title>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200..800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
          tailwind.config = {
            darkMode: "class",
            theme: {
              extend: {
                colors: {
                  "primary": "#008080", 
                  "primary-bright": "#2dd4bf",
                  "background-dark": "#00101d",
                  "deep-navy": "#002147",
                  "card-dark": "#001830",
                  "border-dark": "#162a45",
                  "text-muted": "#94a3b8",
                },
                fontFamily: { "display": ["Inter", "sans-serif"] },
              },
            },
          }
    </script>
</head>
<body class="bg-background-dark text-white font-display overflow-hidden h-screen flex">
    <div class="flex w-full h-full">
        <aside class="w-64 flex flex-col border-r border-border-dark bg-deep-navy py-6">
            <div class="px-6 mb-8"><span class="text-primary-bright font-bold text-xl">VHP Navigator</span></div>
            <nav class="flex flex-col gap-2 px-4">
                <a href="index.html" class="flex items-center gap-3 px-3 py-2 rounded-lg text-text-muted hover:bg-white/5 transition-all">
                    <span class="material-symbols-outlined">supervised_user_circle</span>
                    <span class="text-sm font-medium">Veteran Queue</span>
                </a>
                <a href="partners.html" class="flex items-center gap-3 px-3 py-2 rounded-lg bg-primary/20 text-white border border-primary/30">
                    <span class="material-symbols-outlined text-primary-bright">map</span>
                    <span class="text-sm font-medium">Geospatial Map</span>
                </a>
                <a href="audit.html" class="flex items-center gap-3 px-3 py-2 rounded-lg text-text-muted hover:bg-white/5 transition-all">
                    <span class="material-symbols-outlined">assignment_turned_in</span>
                    <span class="text-sm font-medium">Federal Audit</span>
                </a>
            </nav>
        </aside>

        <main class="flex-1 flex flex-col overflow-hidden">
            <header class="h-20 border-b border-border-dark flex items-center justify-between px-8 bg-card-dark">
                <h2 class="text-xl font-bold">Placement Intelligence Map</h2>
                <div class="flex gap-4">
                     <span class="text-xs text-text-muted border border-border-dark px-3 py-1 rounded-full">Region: DC Metro</span>
                </div>
            </header>

            <div class="flex-1 relative bg-[#001524]">
                <div class="absolute inset-0 opacity-40 grayscale" style="background-image: url('https://www.google.com/maps/vt/pb=!1m4!1m3!1i12!2i1174!3i1566!2m3!1e0!2sm!3i633140934!3m8!2sen!3sus!5e1105!12m4!1e68!2m2!1sset!2sRoadmap!4e0!5m1!1e0!23i4111425'); background-size: cover;"></div>
                
                <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2">
                    <div class="size-4 bg-primary rounded-full animate-ping absolute"></div>
                    <div class="size-4 bg-primary rounded-full relative border border-white/50"></div>
                    <div class="mt-4 bg-card-dark/90 backdrop-blur border border-primary/40 p-3 rounded shadow-2xl min-w-[150px]">
                        <p class="text-[10px] font-bold text-primary-bright uppercase">Active Placement</p>
                        <p class="text-sm font-bold">Sgt. James Miller</p>
                        <p class="text-[10px] text-text-muted">Distance to VA: 1.2 miles</p>
                    </div>
                </div>

                <div class="absolute bottom-8 left-8 bg-card-dark/95 border border-border-dark p-4 rounded-xl shadow-2xl">
                    <h3 class="text-xs font-bold mb-3 uppercase tracking-widest text-text-muted">Map Legend</h3>
                    <div class="space-y-2">
                        <div class="flex items-center gap-2">
                            <div class="size-2 bg-primary rounded-full"></div>
                            <span class="text-[10px]">Veteran in Queue</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <div class="size-2 bg-yellow-500 rounded-full"></div>
                            <span class="text-[10px]">Available Housing</span>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
