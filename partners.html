<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>VHP | Geospatial Intelligence</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .map-grid { background-image: radial-gradient(rgba(45, 212, 191, 0.1) 1px, transparent 0); background-size: 40px 40px; }
    </style>
</head>
<body class="bg-[#00101d] text-white font-sans overflow-hidden h-screen flex">
    <aside class="w-64 border-r border-[#162a45] bg-[#002147] py-6 shrink-0 flex flex-col">
        <div class="px-6 mb-8 flex items-center gap-2"><div class="size-8 bg-[#008080] rounded flex items-center justify-center font-bold text-xs">VH</div><span class="text-[#2dd4bf] font-bold text-lg">Navigator</span></div>
        <nav class="flex flex-col gap-2 px-4">
            <a href="index.html" class="flex items-center gap-3 px-3 py-2 rounded-lg text-slate-400 hover:bg-white/5"><span class="material-symbols-outlined">supervised_user_circle</span><span class="text-sm">Veteran Queue</span></a>
            <a href="partners.html" class="flex items-center gap-3 px-3 py-2 rounded-lg bg-[#008080]/20 text-white border border-[#008080]/30"><span class="material-symbols-outlined text-[#2dd4bf]">map</span><span class="text-sm font-medium">Geospatial Map</span></a>
            <a href="portal.html" class="flex items-center gap-3 px-3 py-2 rounded-lg text-slate-400 hover:bg-white/5"><span class="material-symbols-outlined">encrypted</span><span class="text-sm">Document Vault</span></a>
        </nav>
    </aside>

    <main class="flex-1 relative flex flex-col">
        <header class="h-20 border-b border-[#162a45] flex items-center justify-between px-8 bg-[#001830] z-10">
            <h2 class="text-xl font-black">GEOSPATIAL PLACEMENT ENGINE</h2>
            <div class="text-[10px] font-black bg-primary/20 text-primary-bright border border-primary/30 px-3 py-1 rounded">Fayetteville, NC | Grid 77-A</div>
        </header>

        <div class="flex-1 bg-background-dark relative map-grid overflow-hidden">
            <img src="https://api.mapbox.com/styles/v1/mapbox/dark-v11/static/-78.8784,35.0527,11,0/1200x800?access_token=pk.eyJ1IjoiY29tcGFzcy1kZW1vIiwiYSI6ImNscW9ycW1xejBicmkyanA0M3h4ZzZ4eXgifQ==" class="absolute inset-0 w-full h-full object-cover opacity-30 grayscale" alt="Map">
            
            <div class="absolute top-[45%] left-[52%]">
                <div class="size-24 bg-primary-bright/20 rounded-full animate-ping absolute -inset-10"></div>
                <div class="size-4 bg-primary-bright rounded-full border-2 border-white relative shadow-[0_0_20px_#2dd4bf]"></div>
                <div class="mt-4 bg-card-dark border border-primary/50 p-4 rounded-xl shadow-2xl w-56 backdrop-blur-md">
                    <p class="text-[9px] font-black text-primary-bright uppercase mb-1">TARGET: Sgt. James Miller</p>
                    <p class="text-xs font-bold">1.2 Mi from VA Medical</p>
                    <p class="text-[10px] text-text-muted mt-1">Status: Search Optimized</p>
                </div>
            </div>

            <div class="absolute bottom-10 left-10 bg-card-dark/90 border border-[#162a45] p-5 rounded-2xl w-64 backdrop-blur-md">
                <h4 class="text-[10px] font-black text-text-muted uppercase mb-4 tracking-widest">Heatmap Intensity</h4>
                <div class="space-y-3">
                    <div class="flex items-center gap-3"><div class="size-2.5 rounded-full bg-risk-red shadow-[0_0_8px_#ff4d4d]"></div><span class="text-xs font-bold uppercase">Critical Placement</span></div>
                    <div class="flex items-center gap-3"><div class="size-2.5 rounded-full bg-primary-bright"></div><span class="text-xs font-bold uppercase">Available Partner Units</span></div>
                </div>
            </div>
        </div>
    </main>
