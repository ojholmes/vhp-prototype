<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>VHP | Geospatial Intelligence</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200..800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: "class", theme: { extend: { colors: { "primary": "#008080", "primary-bright": "#2dd4bf", "background-dark": "#00101d", "deep-navy": "#002147", "card-dark": "#001830", "border-dark": "#162a45", "text-muted": "#94a3b8" } } } }
    </script>
</head>
<body class="bg-background-dark text-white font-sans overflow-hidden h-screen flex">
    <aside class="w-64 border-r border-border-dark bg-deep-navy py-6 shrink-0 flex flex-col">
        <div class="px-6 mb-8 flex items-center gap-2"><div class="size-8 bg-primary rounded flex items-center justify-center font-bold text-xs">VH</div><span class="text-primary-bright font-bold text-lg">Navigator</span></div>
        <nav class="flex flex-col gap-2 px-4">
            <a href="index.html" class="flex items-center gap-3 px-3 py-2 rounded-lg text-text-muted hover:bg-white/5"><span class="material-symbols-outlined">supervised_user_circle</span><span class="text-sm">Veteran Queue</span></a>
            <a href="partners.html" class="flex items-center gap-3 px-3 py-2 rounded-lg bg-primary/20 text-white border border-primary/30"><span class="material-symbols-outlined text-primary-bright">map</span><span class="text-sm">Geospatial Map</span></a>
            <a href="portal.html" class="flex items-center gap-3 px-3 py-2 rounded-lg text-text-muted hover:bg-white/5"><span class="material-symbols-outlined">encrypted</span><span class="text-sm">Document Vault</span></a>
            <a href="audit.html" class="flex items-center gap-3 px-3 py-2 rounded-lg text-text-muted hover:bg-white/5"><span class="material-symbols-outlined">assignment_turned_in</span><span class="text-sm">Federal Audit</span></a>
        </nav>
    </aside>

    <main class="flex-1 relative flex flex-col">
        <header class="h-20 border-b border-border-dark flex items-center justify-between px-8 bg-card-dark z-10">
            <h2 class="text-xl font-bold">Placement Intelligence Map</h2>
            <div class="bg-white/5 border border-white/10 px-3 py-1 rounded text-[10px] text-text-muted font-bold uppercase tracking-widest">Region: DC Metro / Fayetteville</div>
        </header>

        <div class="flex-1 bg-[url('https://api.mapbox.com/styles/v1/mapbox/dark-v11/static/-78.8784,35.0527,12,0/1200x800?access_token=pk.eyJ1IjoiY29tcGFzcy1kZW1vIiwiYSI6ImNscW9ycW1xejBicmkyanA0M3h4ZzZ4eXgifQ==')] bg-cover bg-center relative">
            <div class="absolute inset-0 bg-background-dark/40 backdrop-grayscale-[0.5]"></div>
            
            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 group cursor-pointer">
                <div class="size-4 bg-primary-bright rounded-full border-2 border-white animate-pulse"></div>
                <div class="absolute top-6 left-1/2 -translate-x-1/2 w-48 bg-card-dark border border-primary/50 p-3 rounded-lg shadow-2xl">
                    <p class="text-[9px] text-primary-bright font-bold uppercase mb-1">Active Placement</p>
                    <p class="text-xs font-bold">Sgt. James Miller</p>
                    <p class="text-[10px] text-text-muted">Distance to VA: 1.2 miles</p>
                </div>
            </div>

            <div class="absolute bottom-8 left-8 bg-card-dark/90 border border-border-dark p-4 rounded-xl backdrop-blur-md">
                <h4 class="text-[10px] font-bold text-text-muted uppercase mb-3">Map Legend</h4>
                <div class="space-y-2">
                    <div class="flex items-center gap-3"><div class="size-2 rounded-full bg-primary-bright"></div><span class="text-[10px]">Veteran in Queue</span></div>
                    <div class="flex items-center gap-3"><div class="size-2 rounded-full bg-yellow-500"></div><span class="text-[10px]">Available Housing</span></div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
