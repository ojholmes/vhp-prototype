<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>VHP Staff Navigator Dashboard</title>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200..800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script id="tailwind-config">
          tailwind.config = {
            darkMode: "class",
            theme: {
              extend: {
                colors: {
                  "primary": "#008080", 
                  "primary-bright": "#2dd4bf",
                  "background-dark": "#00101d",
                  "deep-navy": "#002147",
                  "card-dark": "#001830",
                  "border-dark": "#162a45",
                  "text-muted": "#94a3b8",
                  "risk-red": "#D32F2F",
                  "success-green": "#388E3C",
                },
                fontFamily: { "display": ["Inter", "sans-serif"] },
              },
            },
          }
    </script>
</head>
<body class="bg-background-dark text-white font-display overflow-hidden h-screen flex">
    <div class="flex w-full h-full">
        <aside class="w-64 flex flex-col border-r border-border-dark bg-deep-navy py-6">
            <div class="px-6 mb-8"><span class="text-primary-bright font-bold text-xl">VHP Navigator</span></div>
            <nav class="flex flex-col gap-2 px-4">
                <a href="index.html" class="flex items-center gap-3 px-3 py-2 rounded-lg bg-primary/20 text-white border border-primary/30">
                    <span class="material-symbols-outlined text-primary-bright">supervised_user_circle</span>
                    <span class="text-sm font-medium">Veteran Queue</span>
                </a>
                <a href="audit.html" class="flex items-center gap-3 px-3 py-2 rounded-lg text-text-muted hover:bg-white/5 transition-all">
                    <span class="material-symbols-outlined">assignment_turned_in</span>
                    <span class="text-sm font-medium">Federal Audit</span>
                </a>
            </nav>
        </aside>

        <main class="flex-1 flex flex-col overflow-hidden">
            <header class="h-20 border-b border-border-dark flex items-center justify-between px-8 bg-card-dark">
                <h2 class="text-xl font-bold">VHP Staff Portal</h2>
                <div class="flex items-center gap-2 bg-background-dark border border-primary/20 px-4 py-1.5 rounded-full">
                    <span class="text-[11px] font-bold text-primary-bright uppercase">System Secure: HIPAA Ready</span>
                </div>
            </header>

            <div class="p-8 grid grid-cols-12 gap-6 overflow-y-auto">
                <div class="col-span-4 bg-card-dark border border-primary/40 rounded-xl p-6 shadow-lg">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <h3 class="text-white font-bold text-lg" id="vet-name">Sgt. James Miller</h3>
                            <span class="bg-risk-red/20 text-risk-red text-[10px] font-bold px-2 py-0.5 rounded" id="vet-status">Eviction Imminent</span>
                        </div>
                        <div class="size-12 rounded-full border-4 border-risk-red flex items-center justify-center">
                            <span class="text-sm font-bold" id="risk-score-display">95</span>
                        </div>
                    </div>
                    <button id="approve-btn" onclick="updateVeteranStatus()" class="w-full bg-primary hover:bg-primary-bright text-white font-bold py-2 rounded-lg transition-all">Approve Documentation</button>
                </div>
                
                <div class="col-span-8 bg-card-dark border border-border-dark rounded-xl p-6">
                    <h3 class="text-sm font-bold uppercase text-text-muted mb-4 tracking-widest">Live Audit Log</h3>
                    <div id="audit-log-list" class="space-y-4">
                        <p class="text-xs text-text-muted italic">Waiting for system update...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const supabaseUrl = 'https://qfymdqmqtrphxoqnipze.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFmeW1kcW1xdHJwaHhvcW5pcHplIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU5NjU2MDcsImV4cCI6MjA4MTU0MTYwN30.rLl934YDxsYBChz779mfeKnUa4ayMFLyjqu7_XmGn5U';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        async function loadVeteranData() {
            const { data, error } = await _supabase
                .from('veterans')
                .select('*')
                .eq('name', 'Sgt. James Miller')
                .single();
            
            if (data) {
                document.getElementById('vet-name').innerText = data.name;
                document.getElementById('vet-status').innerText = data.status;
                document.getElementById('risk-score-display').innerText = data.risk_score;
            }
        }

        async function updateVeteranStatus() {
            const btn = document.getElementById('approve-btn');
            btn.innerText = "Processing...";
            const { error } = await _supabase
                .from('veterans')
                .update({ status: 'Documentation Verified', risk_score: 70 })
                .eq('name', 'Sgt. James Miller');
            
            if (!error) {
                document.getElementById('vet-status').innerText = 'Verified';
                document.getElementById('vet-status').className = 'bg-success-green/20 text-success-green text-[10px] font-bold px-2 py-0.5 rounded';
                btn.innerText = "Approved ✓";
                btn.className = "w-full bg-success-green/20 text-success-green font-bold py-2 rounded-lg cursor-not-allowed";
                addLogEntry();
            }
        }

        function addLogEntry() {
            const list = document.getElementById('audit-log-list');
            list.innerHTML = `<div class="p-3 bg-white/5 border-l-2 border-success-green rounded-r">
                <p class="text-xs font-bold text-white">Voucher Issued</p>
                <p class="text-[10px] text-text-muted">Sgt. James Miller status updated to Verified.</p>
            </div>` + list.innerHTML;
        }

        loadVeteranData();
    </script>
</body>
</html>
